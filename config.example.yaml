# switchnet-discord configuration. Copy to config.yaml.
#
# Keep the two secrets out of this file: set them in the environment instead
# (deploy/switchnet-discord.service reads /etc/switchnet-discord.env):
#   SWITCHNET_DISCORD_TOKEN   the bot token from the Discord developer portal
#   SWITCHNET_BOT_API_TOKEN   GRID0+'s baas.bot_api.token

discord:
  token: ""
  # The servers the bot answers in. Commands are registered per server, and
  # anything from elsewhere (including DMs) is ignored.
  guild_ids: ["000000000000000000"]
  # Optional: a role a member needs before /register works. Empty: anyone in
  # the server can register.
  register_role_id: ""

switchnet:
  # GRID0+'s baas.bot_api.listen. The bot runs on the same host.
  api_url: "http://127.0.0.1:8096"
  api_token: ""

dashboard:
  # Optional: /dashboard sends an admin a login link that works for fifteen
  # minutes. Set the token in the environment as SWITCHNET_DASHBOARD_TOKEN
  # (GRID0+'s dashboard.token). Empty url: no /dashboard command.
  url: ""
  token: ""
  admin_role_id: ""

fest:
  # Splatfests run from Discord: /fest create (mods), voting by reaction,
  # LAN game submissions a mod reviews. Empty mod_role_ids: no fest commands.
  # The bot needs Manage Roles (and its role above every team role), Add
  # Reactions and Manage Messages in the fest channel.
  mod_role_ids: []
  # Default channel for a fest's vote post and announcements; /fest create
  # can name another. Empty: the channel the command is run in.
  channel_id: ""
  # Where submitted LAN games wait for a mod. Required with mod_role_ids.
  review_channel_id: ""
  # Where the play-open, halftime, play-over and results posts go, so the
  # vote channel holds only the vote. Empty: they reply to the vote post.
  announce_channel_id: ""

alerts:
  # Posts when a GRID0+ service goes down and when it comes back. Empty
  # channel_id: no alerts.
  channel_id: ""
  ping_role_id: ""
  interval_seconds: 60
  # Reads in a row a service must fail before it is reported: a deploy
  # restarts every service for a few seconds.
  down_after: 3

# See docs/TOURNAMENTS.md. Empty store_file disables both tournament commands.
tournaments:
  store_file: ""
  # Example: /var/lib/grid0plus-discord/tournaments.json (writable by the bot).
  # Administrators always qualify; additional trusted organizer roles may be listed.
  admin_role_ids: []
